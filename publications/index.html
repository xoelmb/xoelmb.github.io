<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Publicaciones — Xoel Mato Blanco</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
  <style>
    .filters{display:flex; gap:.6rem; margin:.6rem 0 1rem}
    .filters input, .filters select{
      padding:.5rem .7rem; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--text);
    }
    table{width:100%; border-collapse: collapse; background: var(--card); border:1px solid var(--border); border-radius: var(--radius); overflow:hidden}
    th, td{padding:.8rem 1rem; border-bottom:1px solid var(--border); text-align:left}
    th{font-weight:700}
    .badge{font-size:.75rem; padding:.15rem .45rem; border-radius:999px; border:1px solid var(--border)}
    .badge.preprint{background:rgba(124,156,255,.08)}
    .badge.peer{background:rgba(167,139,250,.08)}
    .empty{opacity:.6}
  </style>
</head>
<body>
  <div class="bg-mesh parallax" style="--bg:url(/assets/img/hero_mesh.jpg)" aria-hidden="true"></div>
  <header class="site-header">
    <a class="brand" href="/"><img src="/assets/img/logo_xoelbio.svg" alt="xoel.bio" class="brand-logo" /></a>
    <nav class="nav">
      <a href="/">Inicio</a>
      <a href="/#about">Sobre mí</a>
      <a href="/#work">Trabajo</a>
      <a href="/publications/">Publicaciones</a>
      <a href="/#contact">Contacto</a>
      <button id="themeToggle" class="theme-toggle" aria-label="Cambiar tema">◐</button>
    </nav>
  </header>

  <main class="section">
    <div class="section-head">
      <h2>Publicaciones</h2>
      <p class="muted">Filtra por año, tipo o busca por texto. Fuente: ORCID / Crossref / bioRxiv (JSON).</p>
    </div>

    <div class="filters">
      <input id="q" type="search" placeholder="Buscar (título, journal, DOI)">
      <select id="year"><option value="">Año</option></select>
      <select id="kind">
        <option value="">Tipo</option>
        <option value="peer">Peer-reviewed</option>
        <option value="preprint">Preprint</option>
      </select>
    </div>

    <table id="pubs">
      <thead><tr><th style="width:80px">Año</th><th>Título</th><th style="width:220px">Fuente</th><th style="width:140px">Tipo</th></tr></thead>
      <tbody></tbody>
    </table>
  </main>

  <footer class="site-footer">
    <p>© <span id="year"></span> Xoel Mato Blanco · Hecho con GitHub Pages</p>
  </footer>

  <script src="/assets/js/theme.js"></script>
  <script>
  document.getElementById('year').textContent = new Date().getFullYear();
  const tbody = document.querySelector('#pubs tbody');
  const yearSel = document.getElementById('year');
  const kindSel = document.getElementById('kind');
  const q = document.getElementById('q');
  let rows = [];

  fetch('/assets/pubs.json').then(r => r.json()).then(data => {
    rows = data;
    render();
    fillYearOptions(data);
  });

  function fillYearOptions(data){
    const years = Array.from(new Set(data.map(d => String(d.year))).values())
      .filter(Boolean).sort((a,b)=>b.localeCompare(a));
    years.forEach(y => {
      const opt = document.createElement('option');
      opt.value = y; opt.textContent = y;
      yearSel.appendChild(opt);
    });
  }

  function render(){
    const qq = q.value.toLowerCase().trim();
    const y = yearSel.value;
    const k = kindSel.value;
    tbody.innerHTML = '';
    rows.forEach(p => {
      const text = [p.title, p.venue, p.doi].join(' ').toLowerCase();
      const okQ = !qq || text.includes(qq);
      const okY = !y || String(p.year) === y;
      const okK = !k || p.kind === k;
      if(!(okQ && okY && okK)) return;
      const tr = document.createElement('tr');
      const badge = p.kind ? `<span class="badge ${p.kind}">${p.kind || ''}</span>` : '<span class="badge empty">—</span>';
      tr.innerHTML = `
        <td>${p.year || ''}</td>
        <td>${p.title || ''}<div class="tiny muted">${p.doi ? 'DOI: <a href="https://doi.org/'+p.doi+'" target="_blank" rel="noopener">'+p.doi+'</a>' : ''}</div></td>
        <td>${p.url ? '<a href="'+p.url+'" target="_blank" rel="noopener">'+(p.venue||'')+'</a>' : (p.venue||'')}</td>
        <td>${badge}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  [q, yearSel, kindSel].forEach(el => el.addEventListener('input', render));
  </script>
</body>
</html>
